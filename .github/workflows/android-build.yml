name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # The `secrets` context is not available in a step-level `if`, so the
    # "do we have signing set up?" test is hoisted into an env var here.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Credentials are injected at build time, never committed. Add these
      # under Settings -> Secrets and variables -> Actions.
      - name: Write local.properties
        working-directory: android
        run: |
          {
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
          } > local.properties

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: telecalling-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # ---------------------------------------------------------------
      # Signed release build.
      #
      # Only runs when a keystore secret is present, so the workflow still
      # succeeds before you have set signing up. To enable:
      #   keytool -genkeypair -v -keystore release.jks -keyalg RSA \
      #     -keysize 2048 -validity 10000 -alias telecall
      #   base64 -w0 release.jks          # paste as KEYSTORE_BASE64
      # then add KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD as secrets.
      # ---------------------------------------------------------------
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: telecalling-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Clean up keystore
        if: always()
        working-directory: android
        run: rm -f release.jks local.properties
